name: Validate RPG code
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server JavaScript
        run: |
          node --check server/server.js
          node --check save-server/server.js
      - name: Check inline game scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('pixel-rpg/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const source = match[1].trim();
            if (!source) continue;
            new vm.Script(source, { filename: 'pixel-rpg-inline-' + index + '.js' });
            checked++;
          }
          if (!checked) throw new Error('No inline scripts found');
          console.log('Validated ' + checked + ' inline script blocks');
          NODE
